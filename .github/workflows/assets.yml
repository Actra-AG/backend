# Checks that the built assets in dist/ match src/assets/ (npm run build, docs/assets.md)
name: Assets

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: dist/ is up to date
        run: git diff --exit-code -- dist/
