<!DOCTYPE html>
<html class="no-js" lang="{tst:text value='language'}">
<head>
  <meta charset="{tst:text value='charset'}"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{tst:text value='pageTitle'} | {tst:text value='backendTitle'}</title>
  <meta name="author" content="Actra AG Webagentur"/>
  <meta name="robots" content="noindex,nofollow"/>
  <script nonce="{tst:text value='cspNonce'}">
    document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  </script>
  <tst:for value="stylesPaths" var="path">
    <link rel="stylesheet" href="{tst:text value='path.src'}">
  </tst:for>
</head>
<body class="body-authentication">
<header class="auth-header">
  <div class="auth-logo">{tst:text value='backendName'}</div>
  <tst:if compare="hasLanguageSwitcher" operator="EQ" against="true">
  <nav class="language-switcher" aria-label="{tst:text value='languageSwitcherLabel'}">
    <ul class="language-switcher-list">
      <tst:for value="languageSwitcher" var="language">
        <li>
          <tst:if compare="language.isCurrent" operator="EQ" against="true">
            <span lang="{tst:text value='language.languageCode'}" aria-current="true">{tst:text value='language.label'}</span>
          </tst:if>
          <tst:else>
            <a href="{tst:text value='language.href'}" lang="{tst:text value='language.languageCode'}"
               hreflang="{tst:text value='language.languageCode'}">{tst:text value='language.label'}</a>
          </tst:else>
        </li>
      </tst:for>
    </ul>
  </nav>
  </tst:if>
</header>
<main class="auth-main | flow">
  <tst:loadSubTpl tplfile="{this}"/>
</main>
<tst:if compare="frontendHref" operator="NE" against="">
  <footer class="auth-footer">
    <a href="{tst:text value='frontendHref'}">{tst:text value='frontendName'}</a>
  </footer>
</tst:if>
</body>
</html>
