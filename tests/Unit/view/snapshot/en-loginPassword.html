<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in | Test backend</title>
  <meta name="author" content="Actra AG Webagentur"/>
  <meta name="robots" content="noindex,nofollow"/>
  <script nonce="nonce">
    document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  </script>
  </head>
<body class="body-authentication">
<header class="auth-header">
  <div class="auth-logo">Test backend</div>
    <nav class="language-switcher" aria-label="Change language">
    <ul class="language-switcher-list">
              <li>
                      <a href="/backend/language.html?language=de&amp;returnTo=%2Fbackend%2FloginPassword.html" lang="de"
               hreflang="de">Deutsch</a>
                  </li>
              <li>
                      <span lang="en" aria-current="true">English</span>
          
                  </li>
          </ul>
  </nav>
  </header>
<main class="auth-main | flow">
  <p>Enter the credentials you are registered with.</p>
<form method="post" action="?LoginPasswordForm" class="form form-login"><input type="hidden" name="csrftoken" value="…"><input type="hidden" name="returnTo" value="/backend/user-5.html"><dl><dt><label for="email">Email</label></dt><dd><input type="email" name="email" id="email" value="" autofocus></dd></dl><dl><dt><label for="password">Password</label></dt><dd><input type="password" name="password" id="password" value="" autocomplete="current-password"></dd></dl><div class="form-control"><button type="submit" name="submit">Continue</button><a href="/backend/passwordForgotten.html" class="link-cancel">Forgot your password?</a></div></form></main>
</body>
</html>
